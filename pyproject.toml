[project]
name = "georgian-ipa-spanish"
version = "0.1.0"
description = "A Georgian pronunciation dictionary for Latin American Spanish speakers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["ruff"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
