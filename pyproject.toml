[project]
name = "georgian-ipa-spanish"
version = "0.1.0"
description = "A Georgian pronunciation dictionary for Latin American Spanish speakers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "pydantic>=2.14.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
audio = [
    "piper-tts>=1.8.0",
]
dev = [
    "httpx2",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
